<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcf3f6">
<meta name="robots" content="noindex">
<title>Study 듣기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
  /* Study 앱의 '20회 듣기' 전용 페이지. 사파리에서 직접 열려야 아이폰 영어 음성이 나온다.
     문장은 주소의 # 뒤에만 실려 오므로 서버로 전송되지 않고, 어디에도 저장하지 않는다. */
  :root {
    --bg: #fcf3f6; --paper: #fff; --paper-2: #fdf1f5; --paper-3: #f9e6ed;
    --text: #3a2e33; --muted: #94818a; --line: #f1dde5;
    --pink: #ff7fa8; --pink-2: #ffa9c3; --pink-d: #e0588a; --pink-soft: #ffe9f0;
    --mint: #33c39a; --mint-d: #1f9b77;
    --shadow: 0 1px 2px rgba(150, 70, 100, .06), 0 12px 32px -14px rgba(150, 70, 100, .32);
    --display: 'Jua', 'Apple SD Gothic Neo', sans-serif;
    --body: 'Gothic A1', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1418; --paper: #281e23; --paper-2: #31252b; --paper-3: #3a2c33; --text: #f8eef2; --muted: #bba4ae; --line: #43333a; --pink-soft: #43283a; color-scheme: dark; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--body);
    padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 4px 0 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .card { background: var(--paper); border-radius: 26px; padding: 20px; box-shadow: var(--shadow); }
  .now { display: grid; justify-items: center; gap: 14px; text-align: center; }
  .ring { --p: 0; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--pink) calc(var(--p) * 1%), var(--paper-3) 0); transition: background .3s; }
  .play { width: 104px; height: 104px; border-radius: 50%; border: 0; color: #fff; cursor: pointer; background: linear-gradient(180deg, var(--pink-2), var(--pink)); box-shadow: 0 4px 0 var(--pink-d); display: grid; place-items: center; outline: 6px solid var(--paper); }
  .play:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-d); }
  .play svg { width: 44px; height: 44px; }
  .count { font-family: var(--display); font-size: 40px; color: var(--pink-d); line-height: 1; }
  .count small { font-size: 18px; color: var(--muted); }
  .en { font-size: 23px; font-weight: 800; line-height: 1.4; margin: 0; }
  .ko { color: var(--muted); font-size: 14px; margin: 0; }
  .list { display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 18px; background: var(--paper-2); border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .item.on { background: var(--pink-soft); }
  .item > span { min-width: 0; } .item b { display: block; font-size: 15px; color: var(--text); } .item b + span { display: block; font-size: 12px; color: var(--muted); }
  .item em { font-style: normal; font-weight: 800; font-size: 13px; color: var(--mint-d); white-space: nowrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { border: 0; background: var(--paper-2); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--text); color: var(--paper); }
  .hint { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
  .warn { background: #fff4dd; color: #7a5200; border-radius: 16px; padding: 12px 14px; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); }
  button:focus-visible { outline: 3px solid var(--pink-2); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>20회 듣기</h1>
    <p class="sub">들으면서 따라 말해 보세요. 문장 사이에 따라 말할 틈이 있어요.</p>
  </header>

  <section class="card now" id="now" hidden>
    <div class="ring" id="ring"><button class="play" id="play" aria-label="재생"></button></div>
    <div class="count" id="count">0<small> / 20</small></div>
    <p class="en" id="en"></p>
    <p class="ko" id="ko"></p>
    <div class="row" id="speeds" role="radiogroup" aria-label="속도"></div>
    <p class="hint" id="state">재생 버튼을 누르면 시작해요</p>
  </section>

  <section class="card" id="playlist" hidden>
    <div class="list" id="items"></div>
  </section>

  <p class="warn" id="nosynth" hidden>이 브라우저는 음성 읽기를 지원하지 않아요. 사파리나 크롬에서 열어 주세요.</p>
  <section class="card empty" id="empty" hidden>들을 문장이 없어요. Study 앱에서 '사파리에서 듣기'를 눌러 열어 주세요.</section>
</main>

<script>
(() => {
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
  const STOP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>';
  const $ = (id) => document.getElementById(id);

  // 주소 형식: #n=20&r=0.9&s=영어|한국어&s=영어|한국어 ...  (문장은 encodeURIComponent)
  // 새 형식: #d=<base64url(JSON {n, r, s:[[영어, 한국어], ...]})>  (영문자·숫자만이라 링크가 중간에 깨지지 않음)
  // 옛 형식: #n=20&r=0.9&s=영어|한국어
  const params = new URLSearchParams(location.hash.slice(1));
  let data = null;
  try {
    const d = params.get('d');
    if (d) {
      const bin = atob(d.replace(/-/g, '+').replace(/_/g, '/'));
      data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
    }
  } catch (e) { data = null; }
  const items = data
    ? (data.s || []).map(([en, ko = '']) => ({ en, ko })).filter((x) => x.en)
    : params.getAll('s').map((v) => { const [en, ko = ''] = v.split('|'); return { en, ko }; }).filter((x) => x.en);
  const target = Math.max(1, Math.min(100, Number(data ? data.n : params.get('n')) || 20));
  let rate = Math.max(0.5, Math.min(1.2, Number(data ? data.r : params.get('r')) || 0.9));
  const done = items.map(() => 0);
  let idx = 0, playing = false, token = 0;

  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  if (!synth) $('nosynth').hidden = false;
  if (!items.length) { $('empty').hidden = false; return; }
  $('now').hidden = false;
  if (items.length > 1) $('playlist').hidden = false;

  // 아이폰은 이름으로 고른 목소리가 내려받지 않은 상태일 수 있어 시스템 기본(en-US)에 맡김
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function voice() {
    if (ios || !synth) return null;
    const vs = synth.getVoices().filter((v) => v.lang.toLowerCase().startsWith('en'));
    return ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny'].map((n) => vs.find((v) => v.name.includes(n))).find(Boolean) || vs.find((v) => v.lang === 'en-US') || null;
  }

  function render() {
    const it = items[idx];
    $('en').textContent = it.en;
    $('ko').textContent = it.ko;
    $('count').innerHTML = `${done[idx]}<small> / ${target}</small>`;
    $('ring').style.setProperty('--p', Math.round((Math.min(done[idx], target) / target) * 100));
    $('play').innerHTML = playing ? STOP : PLAY;
    $('play').setAttribute('aria-label', playing ? '멈춤' : '재생');
    $('speeds').innerHTML = [0.7, 0.9, 1.0].map((r) => `<button class="chip ${r === rate ? 'on' : ''}" data-r="${r}" role="radio" aria-checked="${r === rate}">${r === 0.7 ? '천천히' : r === 0.9 ? '보통' : '원어민'}</button>`).join('');
    $('items').innerHTML = items.map((x, i) => `<button class="item ${i === idx ? 'on' : ''}" data-i="${i}"><span><b></b><span></span></span><em>${done[i] >= target ? '완료' : `${done[i]}/${target}`}</em></button>`).join('');
    [...$('items').children].forEach((el, i) => { el.querySelector('b').textContent = items[i].en; el.querySelector('span span').textContent = items[i].ko; });
  }

  function utter(text, vol) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate; u.volume = vol;
    const v = voice(); if (v) u.voice = v;
    return u;
  }

  // 누른 순간에 남은 횟수를 한꺼번에 줄 세움 (아이폰이 버튼 밖에서 시작하는 재생을 막는 경우 대비)
  function start() {
    if (!synth) return;
    synth.cancel();
    const my = ++token;
    playing = true;
    const left = Math.max(target - done[idx], 0) || target;
    if (done[idx] >= target) done[idx] = 0;
    const at = idx;
    for (let k = 0; k < left; k++) {
      const u = utter(items[at].en, 1);
      u.onend = () => {
        if (my !== token) return;
        done[at]++;
        render();
        if (k === left - 1) next(my);
      };
      u.onerror = (e) => { if (my === token && e.error !== 'interrupted' && e.error !== 'canceled') $('state').textContent = `음성 오류: ${e.error}`; };
      synth.speak(u);
      // 따라 말할 틈: 들리지 않는 짧은 문장
      if (k < left - 1) synth.speak(utter('one two three', 0));
    }
    $('state').textContent = '듣고 따라 말해 보세요';
    render();
  }

  function next(my) {
    if (my !== token) return;
    const n = items.findIndex((_, i) => done[i] < target);
    if (n === -1) { playing = false; $('state').textContent = '모두 들었어요! Study 앱으로 돌아가세요'; render(); return; }
    idx = n;
    start();
  }

  function stop() { token++; playing = false; synth && synth.cancel(); $('state').textContent = '멈췄어요'; render(); }

  $('play').addEventListener('click', () => (playing ? stop() : start()));
  $('speeds').addEventListener('click', (e) => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    rate = Number(b.dataset.r);
    if (playing) start(); else render();
  });
  $('items').addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    idx = Number(b.dataset.i);
    if (playing) start(); else render();
  });
  if (synth) synth.addEventListener?.('voiceschanged', () => {});
  render();
})();
</script>
</body>
</html>
